name: Verify
on:
  push:
  pull_request:
  workflow_dispatch:
  merge_group:
permissions:
  contents: read
jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6-alpine@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395
        env:
          POSTGRES_USER: embermend
          POSTGRES_PASSWORD: fixture-ci-password-only
          POSTGRES_DB: embermend_test
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://embermend:fixture-ci-password-only@127.0.0.1:5432/embermend_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.3
          cache: npm
      - run: bash scripts/install-gitleaks.sh
      - run: npm ci --ignore-scripts
      - run: npm run verify
      - run: npm run db:migrate
      - run: npm run test:integration

  images:
    name: Images
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: verify
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.1
      - run: docker build --target runtime -t embermend-runtime:ci .
      - run: docker run --rm embermend-runtime:ci --version
      - run: docker build --target scanner -t embermend-scanner:ci .
      - name: Verify scanner compiler and isolation-compatible runtime
        run: docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --entrypoint node embermend-scanner:ci --input-type=module -e "import ts from 'typescript'; if (ts.version !== '6.0.3') process.exit(1); await import('@hivemagnus/embermend-scanner'); if (process.execPath !== '/usr/bin/node') throw new Error('Reviewed worker Node path changed');"
      - name: Exercise scanner broker failures and isolated source/preparation entry commands
        run: node test/containers/scanner-protocol.mjs embermend-scanner:ci
