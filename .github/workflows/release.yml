name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  gates:
    uses: ./.github/workflows/ci.yml
  packages:
    needs: gates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.3
      - name: Require the exact package version tag
        run: node --input-type=module -e "import fs from 'node:fs'; const v=JSON.parse(fs.readFileSync('package.json')).version; if (!/^\d+\.\d+\.\d+$/.test(v) || process.env.GITHUB_REF_NAME !== 'v'+v) throw new Error('Exact release version tag required');"
      - run: npm ci --ignore-scripts && npm run db:generate && npm run build && npm run check:packages
      - name: Pack the public contracts, integrations and coordinator plugin
        run: |
          mkdir release-assets
          for workspace in contracts integrations ardent-plugin; do
            npm pack --workspace "@hivemagnus/embermend-$workspace" --ignore-scripts --pack-destination release-assets
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-packages
          path: release-assets/*.tgz
          if-no-files-found: error
  images:
    needs: gates
    strategy:
      fail-fast: false
      matrix:
        target: [runtime, scanner]
        arch: [amd64, arm64]
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/cheftaco/embermend${{ matrix.target == 'scanner' && '-scanner' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.3
      - name: Require the exact package version tag
        run: node --input-type=module -e "import fs from 'node:fs'; const v=JSON.parse(fs.readFileSync('package.json')).version; if (!/^\d+\.\d+\.\d+$/.test(v) || process.env.GITHUB_REF_NAME !== 'v'+v) throw new Error('Exact release version tag required');"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Build the native candidate
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: embermend-candidate:${{ matrix.target }}-${{ matrix.arch }}
          provenance: false
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.licenses=Apache-2.0
      - name: Execute the reviewed native runtime and worker protocols
        env:
          CANDIDATE: embermend-candidate:${{ matrix.target }}-${{ matrix.arch }}
        run: |
          test "$(docker image inspect "$CANDIDATE" --format '{{.Architecture}}')" = '${{ matrix.arch }}'
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges:true --entrypoint /usr/bin/node "$CANDIDATE" --input-type=module -e 'import ts from "typescript"; import {realpathSync} from "node:fs"; const [major,minor,patch]=process.versions.node.split(".").map(Number); if(process.getuid()!==1000 || ts.version!=="6.0.3" || major!==26 || minor<13 || minor===13 && patch<1 || realpathSync("/usr/bin/node")!==process.execPath) throw new Error("Unreviewed worker runtime");'
          node test/containers/scanner-protocol.mjs "$CANDIDATE"
          docker image inspect "$CANDIDATE" --format '{{.Id}}' > "$RUNNER_TEMP/validated-config"
      - name: Scan every HIGH and CRITICAL finding before publication
        env:
          CANDIDATE: embermend-candidate:${{ matrix.target }}-${{ matrix.arch }}
        run: |
          mkdir -p "$RUNNER_TEMP/image-security"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$RUNNER_TEMP/image-security:/reports" \
            aquasec/trivy@sha256:be1190afcb28352bfddc4ddeb71470835d16462af68d310f9f4bca710961a41e image \
            --image-src docker --scanners vuln --severity HIGH,CRITICAL --exit-code 1 \
            --format json --output /reports/security.json "$CANDIDATE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: image-security-${{ matrix.target }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/image-security
          if-no-files-found: ignore
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish the exact candidate with SBOM and provenance
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.licenses=Apache-2.0
      - name: Bind published bytes to the scanned configuration
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          ARCH: ${{ matrix.arch }}
          TARGET: ${{ matrix.target }}
        run: |
          expected=$(cat "$RUNNER_TEMP/validated-config")
          manifest=$(docker buildx imagetools inspect "$IMAGE@$DIGEST" --raw)
          platform=$(jq -er --arg arch "$ARCH" '.manifests[] | select(.platform.os=="linux" and .platform.architecture==$arch) | .digest' <<< "$manifest")
          docker buildx imagetools inspect "$IMAGE@$platform" --raw | jq -e --arg expected "$expected" '.config.digest==$expected'
          mkdir digests
          printf '%s\n' "$DIGEST" > "digests/$TARGET-$ARCH"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: image-digest-${{ matrix.target }}-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error
  publish:
    needs: [images, packages]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: image-digest-*
          path: digests
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-packages
          path: release-assets
      - name: Publish immutable version indexes
        id: manifest
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          for target in runtime scanner; do
            image=ghcr.io/cheftaco/embermend
            [[ "$target" != scanner ]] || image+="-scanner"
            if docker buildx imagetools inspect "$image:$version" >/dev/null 2>&1; then echo 'Refusing to overwrite a released version' >&2; exit 1; fi
          done
          for target in runtime scanner; do
            image=ghcr.io/cheftaco/embermend
            [[ "$target" != scanner ]] || image+="-scanner"
            amd64=$(cat "digests/$target-amd64"); arm64=$(cat "digests/$target-arm64")
            [[ "$amd64" =~ ^sha256:[a-f0-9]{64}$ && "$arm64" =~ ^sha256:[a-f0-9]{64}$ ]]
            docker buildx imagetools create --tag "$image:$version" "$image@$amd64" "$image@$arm64"
            digest=$(docker buildx imagetools inspect "$image:$version" --format '{{json .Manifest.Digest}}' | tr -d '"')
            printf '%s=%s\n' "$target" "$digest" >> "$GITHUB_OUTPUT"
            printf '%s@%s\n' "$image" "$digest" >> release-assets/images.txt
          done
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-name: ghcr.io/cheftaco/embermend
          subject-digest: ${{ steps.manifest.outputs.runtime }}
          push-to-registry: true
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-name: ghcr.io/cheftaco/embermend-scanner
          subject-digest: ${{ steps.manifest.outputs.scanner }}
          push-to-registry: true
      - name: Record compatibility and checksums
        env:
          RUNTIME_DIGEST: ${{ steps.manifest.outputs.runtime }}
          SCANNER_DIGEST: ${{ steps.manifest.outputs.scanner }}
        run: |
          node --input-type=module -e 'import fs from "node:fs"; fs.writeFileSync("release-assets/compatibility.json",JSON.stringify({schema:1,product:"embermend",version:process.env.GITHUB_REF_NAME.slice(1),sourceRevision:process.env.GITHUB_SHA,protocol:1,magnus:{minimumVersion:"2.5.0",embermendProtocol:1},operatorSurface:"hivexui",storage:"postgresql",apiWorker:{image:"ghcr.io/cheftaco/embermend@"+process.env.RUNTIME_DIGEST,commands:["api","worker"],sameImage:true},scanner:{image:"ghcr.io/cheftaco/embermend-scanner@"+process.env.SCANNER_DIGEST,protocol:1},platforms:["linux/amd64","linux/arm64"]},null,2)+"\n");'
          (cd release-assets && sha256sum ./*.tgz compatibility.json images.txt > SHA256SUMS)
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-path: release-assets/*
      - name: Publish the release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file release-assets/images.txt
